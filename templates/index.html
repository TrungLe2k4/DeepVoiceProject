<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Phát Hiện Tấn Công DeepVoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Phát Hiện Tấn Công DeepVoice</h1>
    <form method="POST" enctype="multipart/form-data" class="mt-4">
        <div class="mb-3">
            <label for="audio_file" class="form-label">Chọn file WAV:</label>
            <input class="form-control" type="file" id="audio_file" name="audio_file" accept=".wav" required>
        </div>
        <button type="submit" class="btn btn-primary">Dự đoán</button>
    </form>
</body>
</html>
