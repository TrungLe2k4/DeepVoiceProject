<!-- templates/result.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Kết quả dự đoán</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Kết quả dự đoán cho file: {{ filename }}</h1>
    <table class="table table-bordered mt-3">
        <thead>
            <tr>
                <th>Mô hình</th>
                <th>Đặc trưng</th>
                <th>Nhãn dự đoán</th>
                <th>Xác suất</th>
            </tr>
        </thead>
        <tbody>
            {% for model_name, (feat, label_num, label_str, proba) in results.items() %}
            <tr>
                <td>{{ model_name }}</td>
                <td>{{ feat }}</td>
                <td>{{ label_str }}</td>
                <td>{{ '{:.2%}'.format(proba) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <!-- Hiển thị ảnh spectrogram -->
    <h3>Ảnh Mel Spectrogram</h3>
    <img src="{{ spectro_url }}" alt="Spectrogram" style="max-width: 600px; width: 100%; height: auto; border: 1px solid #ccc;"/>

    <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Dự đoán tiếp</a>
</body>
</html>
